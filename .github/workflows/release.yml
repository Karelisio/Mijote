name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version à publier (vX.Y.Z). Tag existant : ce tag est reconstruit. Nouveau : le tag est
          créé sur le commit de la branche choisie ci-dessus.
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Inputs only reach the shell through env (never ${{ }} inside a script).
      - name: Resolve version, commit and previous release
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_VERSION"; else TAG="$GITHUB_REF_NAME"; fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide : « $TAG » (attendu vX.Y.Z)"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            # Existing tag: build exactly that commit, whatever branch the run was started from.
            SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
            git checkout -q --detach "$SHA"
            echo "Tag $TAG existant : construction de $SHA"
          else
            # New version: build the dispatched commit; the release step creates the tag on it.
            SHA="$(git rev-parse HEAD)"
            echo "Nouveau tag $TAG : il sera créé sur $SHA"
          fi
          # Previous release: highest vX.Y.Z tag below TAG among those reachable from the commit.
          PREV=""
          for t in $(git tag --list 'v*' --merged "$SHA" --sort=-version:refname); do
            [[ "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            [ "$t" != "$TAG" ] || continue
            if [ "$(printf '%s\n%s\n' "$t" "$TAG" | sort -V | tail -n 1)" = "$TAG" ]; then PREV="$t"; break; fi
          done
          echo "Version précédente : ${PREV:-aucune}"
          {
            echo "tag=$TAG"
            echo "name=${TAG#v}"
            echo "sha=$SHA"
            echo "prev=$PREV"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - name: Build web app
        run: npm run build
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}

      - run: npx cap sync android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.tag }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleGithubRelease bundlePlayRelease --no-daemon --stacktrace

      - name: Collect artifacts
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/github/release/app-github-release.apk "out/mijote-$TAG.apk"
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab "out/mijote-$TAG.aab"
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Changelog from commits
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREV: ${{ steps.version.outputs.prev }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          {
            echo "## Mijote $TAG"
            echo
            if [ -n "$PREV" ]; then
              echo "Changements depuis $PREV :"
              echo
              git log --no-merges --pretty='- %s (%h)' "$PREV..$SHA"
            else
              echo "Première version."
              echo
              git log --no-merges --pretty='- %s (%h)' "$SHA"
            fi
            echo
            echo "**APK** : installation directe, mises à jour intégrées à l'app · **AAB** : Google Play"
          } > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      # Creates the release (and the tag, on the built commit, when it does not exist yet: a
      # dispatch is enough, no tag push needed). Assets already published are never replaced.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.version.outputs.sha }}
          name: Mijote ${{ steps.version.outputs.tag }}
          body_path: CHANGELOG_RELEASE.md
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            out/*.apk
            out/*.aab
