<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Ratatouille provençale</title>
</head>
<body>
  <div itemscope itemtype="https://schema.org/Recipe">
    <h1 itemprop="name">Ratatouille provençale</h1>
    <img itemprop="image" src="/images/ratatouille.jpg" alt="Ratatouille" />

    <span itemprop="author" itemscope itemtype="https://schema.org/Person">
      <span itemprop="name">Mamie Josette</span>
    </span>

    <meta itemprop="recipeYield" content="4 personnes" />
    <time itemprop="prepTime" datetime="PT15M">15 min</time>
    <time itemprop="cookTime" datetime="PT40M">40 min</time>

    <ul>
      <li itemprop="recipeIngredient">2 courgettes</li>
      <li itemprop="recipeIngredient">2 aubergines</li>
      <li itemprop="recipeIngredient">3 tomates</li>
      <li itemprop="recipeIngredient">1 poivron</li>
    </ul>

    <div itemprop="recipeInstructions">
      <div itemprop="itemListElement" itemscope itemtype="https://schema.org/HowToStep">
        <span itemprop="text">Couper tous les légumes en dés.</span>
      </div>
      <div itemprop="itemListElement" itemscope itemtype="https://schema.org/HowToStep">
        <span itemprop="text">Faire revenir chaque légume séparément puis mélanger.</span>
      </div>
      <div itemprop="itemListElement" itemscope itemtype="https://schema.org/HowToStep">
        <span itemprop="text">Laisser mijoter 30 minutes à feu doux.</span>
      </div>
    </div>

    <span itemprop="recipeCategory">Accompagnement</span>
    <span itemprop="keywords">légumes, été, provence</span>
  </div>
</body>
</html>
