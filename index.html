<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Keep before any script. Android: Capacitor injects its bridge as a document-start script,
         or inline right after <head>, i.e. before this policy applies. wasm-unsafe-eval: web SQLite;
         unsafe-inline styles: inline style attributes and Vite's dev styles; api.github.com: updates. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.github.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFF8F4" />
    <title>Mijote</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
